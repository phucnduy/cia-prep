      },

        d: 'D1',

        action: 'CAE định kỳ rà soát Điều lệ với Ban điều hành cấp cao và trình HĐQT phê duyệt lại khi có thay đổi lớn.',

        distinction: 'Điều lệ quy định cả dịch vụ đảm bảo và dịch vụ tư vấn, đồng thời xác lập quyền tiếp cận không giới hạn với hồ sơ, nhân sự và tài sản.'

      {

        trap: 'KTNB chỉ được kiểm toán các phòng ban khi có sự đồng ý bằng văn bản của trưởng phòng ban đó.',
        distinction: 'Mandate là nguồn gốc quyền lực do HĐQT trao, còn Charter là văn bản hóa quyền lực và phạm vi hoạt động đó.'

      {
        d: 'D1',

        distinction: 'Tính chính trực là nền tảng của sự tin cậy để các bên liên quan đặt niềm tin vào phán đoán chuyên môn của KTV.'

        action: 'Thực hiện đúng quy định pháp luật sở tại và công bố rõ sự khác biệt nếu ảnh hưởng đến phạm vi kiểm toán.',
        violation: 'Viện cớ một điều khoản luật địa phương khác biệt để hủy bỏ toàn bộ việc áp dụng Chuẩn mực GIAS tại phòng KTNB.',
        trap: 'Chuẩn mực của IIA có hiệu lực pháp lý cao hơn luật pháp quốc gia của nước sở tại.',

                  </div>
                </>
              ) : (
                <>
                  <p>Luyện tập và xem ngay đáp án cùng giải thích chi tiết sau từng câu hỏi.</p>
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-left space-y-3 mt-4">
                    <div>
                      <p className="text-sm font-bold text-slate-700 uppercase mb-2">1. Chọn Chuyên đề (Domain) muốn ôn:</p>
                      <select
                        value={selectedDomain}
                        onChange={(e) => setSelectedDomain(e.target.value)}
                        className="w-full p-2.5 rounded-lg border border-slate-300 bg-white text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      >
                        {CIA_DOMAINS.map((dom) => (
                          <option key={dom.id} value={dom.id}>
                            {dom.code} — {dom.name} ({domainCounts[dom.id] || 0} câu)
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <p className="text-sm font-bold text-slate-700 uppercase mb-2">2. Chọn thứ tự câu hỏi:</p>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button
                          type="button"
                          onClick={() => setPracticeOrder('sequential')}
                          className={`p-3 rounded-lg border text-left transition-all flex items-center text-sm ${
                            practiceOrder === 'sequential'
                              ? 'border-emerald-600 bg-emerald-50 text-emerald-900 font-semibold'
                              : 'border-slate-200 bg-white text-slate-700'
                          }`}
                        >
                          <ArrowRight className="w-5 h-5 mr-2 flex-shrink-0 text-emerald-600" />
                          Lần lượt theo thứ tự ({domainCounts[selectedDomain] || 0} câu)
                        </button>
                        <button
                          type="button"
                          onClick={() => setPracticeOrder('random')}
                          className={`p-3 rounded-lg border text-left transition-all flex items-center text-sm ${
                            practiceOrder === 'random'
                              ? 'border-emerald-600 bg-emerald-50 text-emerald-900 font-semibold'
                              : 'border-slate-200 bg-white text-slate-700'
                          }`}
                        >
                          <Shuffle className="w-5 h-5 mr-2 flex-shrink-0 text-emerald-600" />
                          Xáo trộn ngẫu nhiên ({domainCounts[selectedDomain] || 0} câu)
                        </button>
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>
            
            <button
              onClick={handleStart}
              className={`inline-flex items-center px-8 py-3 text-white font-bold rounded-lg transition-colors shadow-md hover:shadow-lg text-lg ${
                activeMode === 'exam' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-emerald-600 hover:bg-emerald-700'
              }`}
            >
              <Play className="w-6 h-6 mr-2" />
              {activeMode === 'exam' ? 'Bắt đầu làm bài' : 'Bắt đầu luyện tập'}
            </button>
          </div>
        </div>
      );

      const renderQuizScreen = () => {
        const currentQuestion = activeQuestions[currentQuestionIndex] || activeQuestions[0];
        if (!currentQuestion) return null;

        const totalQ = activeQuestions.length;
        const letters = ['A', 'B', 'C', 'D'];
        const domMeta = getDomainMeta(getQuestionDomain(currentQuestion));
        const selectedOption =
          activeMode === 'exam' ? userAnswers[currentQuestion.id] : practiceAnswer;

        const handleSelectOption = (idx) => {
          if (activeMode === 'exam') {
            setUserAnswers((prev) => ({ ...prev, [currentQuestion.id]: idx }));
          } else {
            if (!isPracticeChecked) {
              setPracticeAnswer(idx);
            }
          }
        };

        const handleNextPractice = () => {
          if (currentQuestionIndex < totalQ - 1) {
            setCurrentQuestionIndex((i) => i + 1);
            setPracticeAnswer(null);
            setIsPracticeChecked(false);
          } else {
            setCurrentQuestionIndex(0);
            setPracticeAnswer(null);
            setIsPracticeChecked(false);
          }
        };

        const handleSubmitExam = () => {
          const answeredCount = Object.keys(userAnswers).length;
          if (answeredCount < totalQ) {
            setConfirmModal({
              open: true,
              message: `Bạn mới trả lời ${answeredCount}/${totalQ} câu hỏi. Bạn có chắc chắn muốn nộp bài ngay không?`,
              onConfirm: () => {
                setConfirmModal({ open: false, message: '', onConfirm: null });
                setAppState('results');
              }
            });
          } else {
            setAppState('results');
          }
        };

        return (
          <div className="min-h-screen bg-slate-100 p-4 sm:p-6">
            <div className="max-w-4xl mx-auto space-y-5">
              <div className="bg-white rounded-xl shadow-sm p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <button
                  onClick={() => setAppState('menu')}
                  className="inline-flex items-center text-sm font-medium text-slate-600 hover:text-slate-900 bg-slate-100 px-3 py-1.5 rounded-lg"
                >
                  <Home className="w-4 h-4 mr-1.5" /> Menu chính
                </button>

                <div className="text-sm font-bold text-slate-800">
                  {activeMode === 'exam' ? 'Chế độ Thi thử' : 'Chế độ Luyện tập'} — Câu {currentQuestionIndex + 1} / {totalQ}
                </div>

                <button
                  onClick={() => setShowQuestionGrid((prev) => !prev)}
                  className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 hover:bg-indigo-100"
                >
                  {showQuestionGrid ? 'Ẩn danh sách câu' : `Chọn nhanh câu (1–${totalQ})`}
                </button>
              </div>

              {showQuestionGrid && (
                <div className="bg-white rounded-xl shadow-sm p-4 border border-slate-200 max-h-60 overflow-y-auto">
                  <p className="text-xs font-bold text-slate-500 uppercase mb-2">Nhảy nhanh đến câu hỏi:</p>
                  <div className="grid grid-cols-8 sm:grid-cols-12 gap-1.5">
                    {activeQuestions.map((q, idx) => {
                      const isAnswered = userAnswers[q.id] !== undefined;
                      const isCurrent = idx === currentQuestionIndex;
                      return (
                        <button
                          key={q.id}
                          onClick={() => {
                            setCurrentQuestionIndex(idx);
                            setPracticeAnswer(null);
                            setIsPracticeChecked(false);
                          }}
                          className={`py-1.5 rounded text-xs font-bold border transition-all ${
                            isCurrent
                              ? 'bg-indigo-600 text-white border-indigo-600'
                              : isAnswered
                              ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                              : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          {idx + 1}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                <div className="flex flex-wrap items-center gap-2 mb-4">
                  <span className="text-xs font-bold bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded">
                    Mã câu #{currentQuestion.id}
                  </span>
                  <span className="text-xs font-semibold bg-slate-100 text-slate-700 px-2.5 py-1 rounded">
                    {domMeta.code}: {domMeta.name}
                  </span>
                </div>

                <h3 className="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-relaxed">
                  {currentQuestion.question}
                </h3>

                <div className="space-y-3">
                  {currentQuestion.options.map((opt, idx) => {
                    const isSelected = selectedOption === idx;
                    const isCorrect = idx === currentQuestion.correctAnswer;

                    let optionStyle = 'border-slate-200 bg-white hover:bg-slate-50 text-slate-800';
                    if (activeMode === 'practice' && isPracticeChecked) {
                      if (isCorrect) {
                        optionStyle = 'border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold';
                      } else if (isSelected && !isCorrect) {
                        optionStyle = 'border-rose-500 bg-rose-50 text-rose-950 font-semibold';
                      }
                    } else if (isSelected) {
                      optionStyle = 'border-blue-600 bg-blue-50 text-blue-950 font-semibold';
                    }

                    return (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleSelectOption(idx)}
                        className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-start gap-3 ${optionStyle}`}
                      >
                        <span className="font-bold">{letters[idx]}.</span>
                        <span className="flex-1">{opt}</span>
                        {activeMode === 'practice' && isPracticeChecked && isCorrect && (
                          <CheckCircle className="w-5 h-5 text-emerald-600 flex-shrink-0" />
                        )}
                        {activeMode === 'practice' && isPracticeChecked && isSelected && !isCorrect && (
                          <XCircle className="w-5 h-5 text-rose-600 flex-shrink-0" />
                        )}
                      </button>
                    );
                  })}
                </div>

                {activeMode === 'practice' && isPracticeChecked && (
                  <div className="mt-6 p-5 rounded-xl bg-amber-50 border border-amber-200 text-slate-800">
                    <p className="font-bold text-amber-900 mb-1">
                      {practiceAnswer === currentQuestion.correctAnswer
                        ? 'Chính xác!'
                        : `Chưa đúng. Đáp án đúng là ${letters[currentQuestion.correctAnswer]}.`}
                    </p>
                    <p className="text-sm leading-relaxed">{currentQuestion.explanation}</p>
                  </div>
                )}

                <div className="mt-8 pt-5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                  <button
                    type="button"
                    disabled={currentQuestionIndex === 0}
                    onClick={() => {
                      setCurrentQuestionIndex((i) => Math.max(0, i - 1));
                      setPracticeAnswer(null);
                      setIsPracticeChecked(false);
                    }}
                    className="inline-flex items-center px-4 py-2.5 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 disabled:opacity-40"
                  >
                    <ChevronLeft className="w-4 h-4 mr-1" /> Câu trước
                  </button>

                  {activeMode === 'practice' ? (
                    <div className="flex items-center gap-3">
                      {!isPracticeChecked ? (
                        <button
                          type="button"
                          disabled={practiceAnswer === null}
                          onClick={() => setIsPracticeChecked(true)}
                          className="inline-flex items-center px-6 py-2.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-40"
                        >
                          Kiểm tra đáp án
                        </button>
                      ) : (
                        <button
                          type="button"
                          onClick={handleNextPractice}
                          className="inline-flex items-center px-6 py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white hover:bg-blue-700"
                        >
                          Câu tiếp theo <ChevronRight className="w-4 h-4 ml-1" />
                        </button>
                      )}
                    </div>
                  ) : (
                    <div className="flex items-center gap-3">
                      {currentQuestionIndex < totalQ - 1 && (
                        <button
                          type="button"
                          onClick={() => setCurrentQuestionIndex((i) => Math.min(totalQ - 1, i + 1))}
                          className="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700"
                        >
                          Câu tiếp theo <ChevronRight className="w-4 h-4 ml-1" />
                        </button>
                      )}
                      <button
                        type="button"
                        onClick={handleSubmitExam}
                        className="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700"
                      >
                        Nộp bài & Chấm điểm
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {confirmModal.open && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
                  <div className="flex items-center gap-3 text-amber-600 mb-3">
                    <AlertCircle className="w-6 h-6" />
                    <h4 className="text-lg font-bold text-slate-900">Xác nhận nộp bài</h4>
                  </div>
                  <p className="text-sm text-slate-600 mb-6">{confirmModal.message}</p>
                  <div className="flex justify-end gap-3">
                    <button
                      onClick={() => setConfirmModal({ open: false, message: '', onConfirm: null })}
                      className="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200"
                    >
                      Làm tiếp
                    </button>
                    <button
                      onClick={confirmModal.onConfirm}
                      className="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700"
                    >
                      Nộp bài ngay
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderResultsScreen = () => {
        const totalQ = activeQuestions.length;
        const correctCount = activeQuestions.reduce(
          (acc, q) => acc + (userAnswers[q.id] === q.correctAnswer ? 1 : 0),
          0
        );
        const percentage = Math.round((correctCount / totalQ) * 100);
        const scaledScore = Math.round(250 + (correctCount / totalQ) * 500);
        const isPassed = scaledScore >= 600;
        const letters = ['A', 'B', 'C', 'D'];

        return (
          <div className="min-h-screen bg-slate-100 p-4 sm:p-6 lg:p-8">
            <div className="max-w-4xl mx-auto space-y-6">
              <div className="bg-white rounded-2xl shadow-md p-6 sm:p-8 border border-slate-200 text-center">
                <Award className={`w-16 h-16 mx-auto mb-3 ${isPassed ? 'text-emerald-600' : 'text-amber-500'}`} />
                <h2 className="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">
                  Kết Quả Bài Thi Thử CIA Part 1
                </h2>
                <p className="text-slate-600 mb-6">
                  Điểm quy đổi chuẩn IIA: <strong>{scaledScore} / 750</strong> (Cần 600 điểm để Đạt)
                </p>

                <div className="grid grid-cols-3 gap-4 max-w-lg mx-auto mb-6">
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <div className="text-xs text-slate-500">Số câu đúng</div>
                    <div className="text-xl font-bold text-slate-900">{correctCount} / {totalQ}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <div className="text-xs text-slate-500">Tỷ lệ đúng</div>
                    <div className="text-xl font-bold text-slate-900">{percentage}%</div>
                  </div>
                  <div className={`p-4 rounded-xl border ${isPassed ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
                    <div className="text-xs">Kết quả</div>
                    <div className="text-xl font-bold">{isPassed ? 'ĐẠT (PASS)' : 'CHƯA ĐẠT'}</div>
                  </div>
                </div>

                <div className="flex flex-wrap justify-center gap-3">
                  <button
                    onClick={handleStart}
                    className="inline-flex items-center px-6 py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white hover:bg-blue-700"
                  >
                    <RotateCcw className="w-4 h-4 mr-2" /> Thi lại đề mới
                  </button>
                  <button
                    onClick={() => setAppState('menu')}
                    className="inline-flex items-center px-6 py-2.5 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200"
                  >
                    <Home className="w-4 h-4 mr-2" /> Về Menu chính
                  </button>
                </div>
              </div>

              <div className="space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Chi tiết đáp án & giải thích:</h3>
                {activeQuestions.map((q, idx) => {
                  const userAns = userAnswers[q.id];
                  const isCorrect = userAns === q.correctAnswer;
                  return (
                    <div key={q.id} className="bg-white rounded-xl p-5 border border-slate-200 shadow-xs">
                      <div className="flex items-center gap-2 mb-2">
                        <span className={`text-xs font-bold px-2.5 py-0.5 rounded ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                          Câu {idx + 1} (#{q.id}) — {isCorrect ? 'Đúng' : 'Sai / Chưa làm'}
                        </span>
                      </div>
                      <p className="font-semibold text-slate-900 mb-3">{q.question}</p>
                      <p className="text-sm text-slate-700 mb-1">
                        <strong>Bạn chọn:</strong>{' '}
                        {userAns !== undefined ? `${letters[userAns]}. ${q.options[userAns]}` : 'Chưa trả lời'}
                      </p>
                      <p className="text-sm text-emerald-700 font-semibold mb-3">
                        <strong>Đáp án đúng:</strong> {letters[q.correctAnswer]}. {q.options[q.correctAnswer]}
                      </p>
                      <div className="p-3 rounded-lg bg-amber-50 border border-amber-200 text-xs sm:text-sm text-slate-800">
                        <strong>Giải thích:</strong> {q.explanation}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      if (appState === 'menu') return renderMenuScreen();
      if (appState === 'json_manager') return renderJsonManagerScreen();
      if (appState === 'inspect') return renderInspectScreen();
      if (appState === 'start') return renderStartScreen();
      if (appState === 'quiz') return renderQuizScreen();
      if (appState === 'results') return renderResultsScreen();
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CIAMockExam />);
  </script>
</body>
</html>
